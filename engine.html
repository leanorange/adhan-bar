<!doctype html>
<!-- Hidden window: plays the mp3 and draws the tray icon on a canvas -->
<audio id="a"></audio>
<script>
  const a = document.getElementById('a');
  a.onended = () => api.ended();

  function playAdhan(url) { a.src = url; a.currentTime = 0; return a.play(); }
  function stopAdhan() { a.pause(); api.ended(); }

  function renderIcon(text, status, dark, size) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const x = c.getContext('2d');
    // no badge: only the text color changes with the status
    x.fillStyle = { soon: '#ff453a', playing: '#30d158' }[status] || (dark ? '#fff' : '#000');
    x.textAlign = 'center';
    x.textBaseline = 'alphabetic';
    const fam = '"Bahnschrift Condensed", "Arial Narrow", "Segoe UI", sans-serif';
    // biggest font that fits the width WITHOUT stretching or squeezing the glyphs
    let fs = Math.round(size * 1.3);
    for (; fs > 6; fs--) {
      x.font = `bold ${fs}px ${fam}`;
      if (x.measureText(text).width <= size - 1) break;
    }
    const m = x.measureText(text);
    const y = size / 2 + (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2;
    x.fillText(text, size / 2, y);
    return c.toDataURL();
  }
</script>
