<!doctype html>
<meta charset="utf-8">
<style>
  :root { --fg:#1d1d1f; --sub:#6e6e73; --card:rgba(255,255,255,.55); --line:rgba(0,0,0,.08); }
  @media (prefers-color-scheme: dark) { :root { --fg:#f5f5f7; --sub:#98989d; --card:rgba(60,60,67,.45); --line:rgba(255,255,255,.1); } }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; font:13px -apple-system,"SF Pro Text","Segoe UI Variable","Segoe UI",sans-serif; color:var(--fg); user-select:none; }
  .hero { text-align:center; padding:8px 0 16px; }
  .hero .label { color:var(--sub); font-size:12px; text-transform:uppercase; letter-spacing:.06em; }
  .hero .time { font-size:44px; font-weight:600; letter-spacing:-.02em; margin:2px 0; }
  .hero.soon .time { color:#ff453a; } .hero.playing .time { color:#30d158; }
  .card { background:var(--card); border-radius:12px; margin-bottom:12px; overflow:hidden; }
  .row { display:flex; justify-content:space-between; align-items:center; padding:9px 12px; border-bottom:1px solid var(--line); gap:8px; }
  .row:last-child { border-bottom:0; }
  .row.next { font-weight:600; }
  .sub { color:var(--sub); }
  input[type=number], select { background:transparent; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:3px 6px; font:inherit; width:100px; }
  button { font:inherit; color:var(--fg); background:var(--card); border:1px solid var(--line); border-radius:7px; padding:4px 10px; cursor:pointer; }
  button.danger { background:#ff453a; color:#fff; border:0; }
  .sw { appearance:none; width:38px; height:22px; border-radius:11px; background:#8e8e9380; position:relative; cursor:pointer; transition:.15s; }
  .sw::after { content:""; position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:#fff; transition:.15s; box-shadow:0 1px 3px #0004; }
  .sw:checked { background:#30d158; } .sw:checked::after { left:18px; }
  ::-webkit-scrollbar { width:0; }
  .row span:first-child { white-space:nowrap; }
  .file { max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
</style>

<div id="hero" class="hero"><div class="label" id="lbl">Next prayer</div><div class="time" id="cd">--</div><div class="sub" id="at"></div></div>

<div class="card" id="list"></div>

<div class="card">
  <div class="row"><span>Mute next adhan</span><input type="checkbox" class="sw" id="mute"></div>
  <div class="row"><span>Adhan file</span><span><span class="sub file" id="file">none</span> <button id="pick">Choose…</button></span></div>
  <div class="row"><span>Test</span><span><button id="test">Play</button> <button id="stop" class="danger" style="display:none">Stop</button></span></div>
</div>

<div class="card">
  <div class="row"><span>Latitude</span><input type="number" step="any" id="lat"></div>
  <div class="row"><span>Longitude</span><input type="number" step="any" id="lng"></div>
  <div class="row"><span>Method</span>
    <select id="method">
      <option>MuslimWorldLeague</option><option>Karachi</option><option>Egyptian</option><option>UmmAlQura</option>
      <option>NorthAmerica</option><option>Dubai</option><option>Kuwait</option><option>Qatar</option>
      <option>Singapore</option><option>Turkey</option><option>Tehran</option><option>MoonsightingCommittee</option>
    </select></div>
  <div class="row"><span>Asr (madhab)</span><select id="madhab"><option>Shafi</option><option>Hanafi</option></select></div>
  <div class="row"><span>Warn before (min)</span><input type="number" id="warn" min="1" max="120"></div>
  <div class="row"><span>Start with Windows</span><input type="checkbox" class="sw" id="auto"></div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const cap = (s) => s[0].toUpperCase() + s.slice(1);
  const hms = (s) => [Math.floor(s/3600), Math.floor(s%3600/60), s%60].map((n)=>String(n).padStart(2,'0')).join(':');
  const clock = (ms) => new Date(ms).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
  let editing = false;

  function render(st) {
    const s = st.settings;
    $('hero').className = 'hero ' + st.status;
    $('lbl').textContent = st.playing ? 'Adhan playing' : st.next ? cap(st.next.name) + ' in' : 'Set your location below';
    $('cd').textContent = st.playing ? '♪' : st.remaining != null ? hms(st.remaining) : '--';
    $('at').textContent = st.next ? 'at ' + clock(st.next.time) : '';
    $('list').innerHTML = st.today.map((p) =>
      `<div class="row ${st.next && p.name === st.next.name ? 'next' : ''}"><span>${cap(p.name)}</span><span class="sub">${clock(p.time)}</span></div>`).join('');
    $('stop').style.display = st.playing ? '' : 'none';
    $('mute').checked = s.muteNext;
    $('file').textContent = s.adhanPath ? s.adhanPath.split(/[\\/]/).pop() : 'none';
    if (!editing) {
      $('lat').value = s.lat ?? ''; $('lng').value = s.lng ?? '';
      $('method').value = s.method; $('madhab').value = s.madhab;
      $('warn').value = s.warnMinutes; $('auto').checked = s.autoStart;
    }
  }

  document.querySelectorAll('input[type=number],select').forEach((el) => {
    el.addEventListener('focus', () => editing = true);
    el.addEventListener('blur', () => editing = false);
  });
  const num = (id) => $(id).value === '' ? null : parseFloat($(id).value);
  const push = () => api.set({ lat: num('lat'), lng: num('lng'), method: $('method').value, madhab: $('madhab').value, warnMinutes: num('warn') || 15, autoStart: $('auto').checked });
  ['lat','lng','method','madhab','warn','auto'].forEach((id) => $(id).addEventListener('change', push));
  $('mute').addEventListener('change', () => api.set({ muteNext: $('mute').checked }));
  $('pick').onclick = () => api.pick();
  $('test').onclick = () => api.test();
  $('stop').onclick = () => api.stop();

  api.onState(render);
  api.state().then(render);
</script>
